# dev-platform-gate.yml — copy this file into your project's
# .github/workflows/ to plug into dev-platform's taxonomy enforcement
# at the PR boundary.
#
# What it does: runs two independent checks on every PR targeting
# main and every push to main. (1) check_spec_taxonomy.sh — fails
# the build if any header in tasks/*-spec.md, ROADMAP.md, or
# planning.md uses a killed prefix (R<N>:, Sprint X:, Stage Y:,
# Q<N>-<YYYY>:, etc.) or a killed Change-level synonym. (2)
# check_version_collision.py — fails the build if this branch's
# ROADMAP.md claims a Roadmap Phase version number that origin/main
# or a live GitHub milestone already uses under a different title
# (best-effort: degrades to a non-blocking warning, never a false
# failure, if gh/network access is unavailable).
#
# Pin to a specific tag (e.g., @v1.26) for stability — floating tags
# like @main break reproducibility. Bump the tag when dev-platform
# cuts a new release. Worth bumping rather than leaving: @v0.7 runs
# only check_spec_taxonomy.sh, so a project left on it never gets the
# version-collision guard at all. See docs/CI-INTEGRATION.md in dev-platform
# for the full adoption guide.
#
# The permissions: block below is REQUIRED, not optional. This calls a
# reusable workflow in a DIFFERENT repo (and usually a different GitHub
# org/owner than yours). For a cross-repo reusable-workflow call, GitHub
# rejects the call outright — a silent startup_failure that never even
# appears in your PR's checks list — unless the calling workflow (this
# file) explicitly grants at least what the called job requests. The
# version-collision job needs contents: read + issues: read. Found live
# on SQRL's adoption (2026-08-12): the check was silently never running.

name: dev-platform-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  issues: read

jobs:
  taxonomy:
    uses: teelr/dev-platform/.github/workflows/taxonomy-check.yml@v1.26
